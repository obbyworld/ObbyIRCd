services:
  obbyircd:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    # renovate: datasource=docker depName=obbyworld/obbyircd versioning=docker
    image: ${OBBYIRCD_IMAGE:-obbyworld/obbyircd:6.2.6.6}
    container_name: obbyircd
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "${SSL_HOST_PORT:-6697}:${SSL_PORT:-6697}"
    volumes:
      - ${CONF_BIND:-obbyircd_conf}:/home/obbyircd/obby/conf
      - ${DATA_BIND:-obbyircd_data}:/home/obbyircd/obby/data
      - ${LOGS_BIND:-obbyircd_logs}:/home/obbyircd/obby/logs
      - ${TLS_BIND:-obbyircd_tls}:/home/obbyircd/obby/tls
      - ${CUSTOM_MODULES_BIND:-obbyircd_custom_modules}:/home/obbyircd/obby/custom-modules
      - ${VOICE_BRIDGE_BIND:-obbyircd_voice_bridge}:/run/obbyirc
    environment:
      WS_PORT: "${WS_PORT:-8080}"
      SSL_PORT: "${SSL_PORT:-6697}"
      VOICE_BRIDGE_SOCKET: /run/obbyirc/voice.sock
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost $${WS_PORT:-8080}"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s

  # hosted-backend is built and published from its own repo:
  # https://github.com/obbyworld/hosted-backend
  # We just pull the published image here.
  obby-api:
    image: ${OBBY_API_IMAGE:-obbyworld/obby-api:latest}
    container_name: obby-api
    restart: unless-stopped
    depends_on:
      obbyircd:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
    volumes:
      - ${OBBY_API_DATA_BIND:-obby_api_data}:/app/data
      - ${OBBY_API_IMAGES_BIND:-obby_api_images}:/app/images
      - ${VOICE_BRIDGE_BIND:-obbyircd_voice_bridge}:/run/obbyirc
    environment:
      PORT: "8080"
      VOICE_BRIDGE_SOCKET: /run/obbyirc/voice.sock
      VOICE_TURN_SECRET: ${VOICE_TURN_SECRET}
      VOICE_PUBLIC_IP: ${VOICE_PUBLIC_IP}
      VOICE_TURN_PORT: "${TURN_PORT:-3478}"
      VOICE_MAX_ROOM: "${VOICE_MAX_ROOM:-25}"
    env_file:
      - path: .env
        required: false

  # Web client.  Source: https://github.com/obbyworld/obby
  # Opt-in via `--profile frontend` (or set COMPOSE_PROFILES=frontend in .env)
  # so backend-only devs can `docker compose up` without pulling the SPA.
  obby:
    image: ${OBBY_WEB_IMAGE:-obbyworld/obby:latest}
    container_name: obby-web
    restart: unless-stopped
    profiles: ["frontend"]
    expose:
      - "80"
    env_file:
      - path: .env
        required: false

volumes:
  obbyircd_conf:
  obbyircd_data:
  obbyircd_logs:
  obbyircd_tls:
  obbyircd_custom_modules:
  obbyircd_voice_bridge:
  obby_api_data:
  obby_api_images:
